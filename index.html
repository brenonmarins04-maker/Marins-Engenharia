<script type="application/ld+json">{"@context": "https://schema.org", "@type": "GeneralContractor", "name": "Marins Engenharia Ltda.", "url": "https://www.marinsengenharia.com.br", "logo": "https://www.marinsengenharia.com.br/assets/img/logo-marins.png", "telephone": "+551633073606", "email": "vendas@marinsengenharia.com.br", "areaServed": {"@type": "City", "name": "São Carlos"}, "address": {"@type": "PostalAddress", "streetAddress": "Rua 28 de Setembro, 2882", "addressLocality": "São Carlos", "addressRegion": "SP", "addressCountry": "BR"}}</script>
</head>
<body class="home home--trentino">

<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo" id="cabecalho"></header>

<main id="conteudo">

  <section class="destaque" aria-labelledby="destaque-titulo">
    <picture>
      <source media="(max-width: 700px)" srcset="assets/img/predios/trentino-abertura.jpg" width="1600" height="900">
      <img class="destaque__foto" src="assets/img/predios/trentino-abertura-pc.jpg" alt="Fachada do Edifício Trentino sob o céu azul" fetchpriority="high" width="2000" height="1125">
    </picture>
    <div class="destaque__texto">
      <p class="destaque__rotulo">Destaques</p>
      <h1 id="destaque-titulo">Trentino</h1>
      <p class="destaque__descricao">Moderno, com acabamento de alto padrão e perto da USP.</p>
      <a class="btn destaque__botao" href="https://wa.me/5516997667976?text=Ol%C3%A1%21%20Vi%20o%20Trentino%20no%20site%20da%20Marins%20Engenharia%20e%20gostaria%20de%20saber%20mais%20informa%C3%A7%C3%B5es%20sobre%20ele." target="_blank" rel="noopener noreferrer" aria-label="Saiba mais sobre o Trentino pelo WhatsApp">Saiba mais <span aria-hidden="true">↗</span></a>
    </div>
  </section>

  <section class="apresentacao secao" aria-label="Conheça a Marins Engenharia">
    <div class="env" id="apresentacao-marins"></div>
  </section>

  <!-- prévia dos edifícios -->
  <section class="secao" id="edificios" aria-labelledby="vendas-titulo">
    <div class="env">
      <div class="cab">
        <div>
          <p class="rotulo" data-t="vendas.rotulo"></p>
          <h2 id="vendas-titulo" data-t="vendas.tituloHome"></h2>
          <p data-t="vendas.texto"></p>
        </div>
        <a class="btn btn--linha" href="/edificios" data-t="vendas.verTodos"></a>
      </div>
      <div class="trilho" id="trilho-vendas" tabindex="0" aria-labelledby="vendas-titulo"></div>
    </div>
  </section>

  <!-- chamada da locação -->
  <section class="loc secao--fina" aria-labelledby="loc-titulo">
    <div class="env">
      <p class="rotulo rotulo--claro" data-t="locacao.rotulo"></p>
      <h2 id="loc-titulo" class="h2--menor" data-t="locacao.titulo"></h2>
      <p class="aviso" data-t="locacao.aviso"></p>
      <a class="btn btn--amarelo" href="/locacao" data-t="locacao.verUnidades"></a>
    </div>
  </section>

  <section class="secao depoimentos" aria-labelledby="depo-titulo">
    <div class="env">
      <div class="cab">
        <div>
          <p class="rotulo" data-t="depoimentos.rotulo"></p>
          <h2 id="depo-titulo" data-t="depoimentos.titulo"></h2>
          <p data-t="depoimentos.texto"></p>
        </div>
      </div>
      <div class="depos" id="painel-depoimentos"></div>
    </div>
  </section>
  <!-- contato -->
  <section class="contato secao" id="contato" aria-labelledby="contato-titulo">
    <div class="env">
      <div class="cab">
        <div>
          <p class="rotulo" data-t="contato.rotulo"></p>
          <h2 id="contato-titulo" data-t="contato.titulo"></h2>
          <p data-t="contato.texto"></p>
        </div>
      </div>

      <div class="contato__grade">
        <div>
          <div class="mapa">
            <iframe id="mapa-escritorio" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <ul class="infos">
            <li><span data-icone-pin></span><span><b data-t="contato.escritorio"></b><br><span data-campo="endereco"></span></span></li>
            <li><span data-icone-fone></span><span><b data-t="contato.telefone"></b><br><a data-tel><span data-campo="telefone"></span></a></span></li>
            <li><span data-icone-zap></span><span><b data-t="contato.whatsapp"></b><br><a data-zap="geral" data-icone="nao" target="_blank" rel="noopener"><span data-campo="whatsappVisivel"></span></a></span></li>
            <li><span data-icone-mail></span><span><b data-t="contato.email"></b><br><a data-mail><span data-campo="email"></span></a></span></li>
          </ul>
        </div>

        <form class="form" id="form-contato" novalidate>
          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(16) 99999-9999" required>
          </div>
          <div class="campo">
            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" data-t-placeholder="contato.phMensagem"></textarea>
          </div>
          <button class="btn btn--azul btn--bloco" type="submit" data-t="contato.enviar"></button>
          <p class="form__nota" data-t="contato.aviso"></p>
          <p class="form__aviso" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

</main>

<footer class="rodape" id="rodape"></footer>

<a class="zap-fixo" data-zap="geral" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <span>WhatsApp</span>
</a>

<script src="assets/js/site.js?v=20260929-12"></script>
</body>
</html>
